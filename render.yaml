services:
  - type: web
    name: iitmadras-code-interpreter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AIPIPE_TOKEN
        sync: false
      - key: AI_MODEL
        value: openai/gpt-4o-mini
